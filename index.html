<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hide and Seek App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html,body{height:100%;margin:0;font-family:system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
  #map{position:absolute;inset:0}
  .ui{position:absolute;z-index:1000}
  #bar{left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
  .btn{font:inherit;font-size:15px;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:var(--panel);box-shadow:0 2px 8px #0003;color:inherit;display:flex;align-items:center;gap:6px;cursor:pointer}
  .btn.on{background:var(--ink);color:#fff}
  .btn.go{background:var(--go);color:#fff}
  .btn:disabled{opacity:.4}
  .menu{position:absolute;top:48px;left:0;background:var(--panel);border-radius:10px;box-shadow:0 2px 8px #0003;padding:4px;display:none;min-width:130px}
  .menu.open{display:block}
  .menu button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;padding:10px 12px;border:0;background:none;border-radius:8px}
  .menu button:active{background:#0001}
  .sheet{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:440px;background:var(--panel);border-radius:12px;box-shadow:0 2px 12px #0004;padding:10px 12px;font-size:14px;display:none}
  .sheet.open{display:block}
  .seg{display:flex;margin:8px 0;border-radius:10px;overflow:hidden;border:1px solid var(--ink)}
  .seg button{flex:1;font:inherit;padding:10px 4px;border:0;background:#fff;color:inherit}
  .seg button.sel{background:var(--ink);color:#fff}
  .acts{display:flex;gap:8px}.acts .btn{flex:1;justify-content:center;box-shadow:none;border:1px solid #1d2b2a33}
  .muted{color:var(--muted);font-size:12px}
  #list{max-height:36vh;overflow:auto;margin:6px 0}
  .fx{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #0001}
  .fx input{width:22px;height:22px;flex:none}
  .fx span{flex:1;line-height:1.25}.fx.off span{opacity:.45;text-decoration:line-through}
  .fx button{font:inherit;min-width:40px;min-height:36px;border:1px solid #1d2b2a33;background:#fff;border-radius:8px}
  #cfg{display:flex;align-items:center;gap:8px;margin:8px 0}#cfg input{flex:1}
  .pin{width:30px;height:30px;border-radius:50%;background:var(--pin);color:#fff;border:2px solid #fff;box-shadow:0 1px 5px #0006;display:flex;align-items:center;justify-content:center;font:700 13px system-ui;box-sizing:border-box}
  .chips{display:none;flex-wrap:wrap;gap:6px;margin:8px 0}.chips.open{display:flex}
  .chip{font:inherit;display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid #1d2b2a55;border-radius:16px;background:#fff;color:inherit}
  .chip.sel{background:var(--ink);color:#fff}.chip i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #fff}
  .chk{display:flex;align-items:center;gap:8px;margin:10px 0 4px}.chk input{width:22px;height:22px}
  .zl{width:34px;height:22px;border-radius:11px;background:#000b;color:#fff;font:700 13px/22px system-ui;text-align:center}.zl.sel{background:var(--go)}
  .locbtn{width:42px;padding:0;justify-content:center}
  #toast{left:8px;right:8px;top:calc(110px + env(safe-area-inset-top,0px));max-width:440px;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;display:none;pointer-events:none}
  .stad{position:relative;width:30px;height:30px}.stad i{display:flex;align-items:center;justify-content:center;width:30px;height:30px;box-sizing:border-box;border-radius:50%;background:#fff;border:2px solid var(--stad);font-style:normal;font-size:16px;box-shadow:0 1px 5px #0005}
  .stad b{position:absolute;left:34px;top:5px;white-space:nowrap;background:var(--panel);border-radius:6px;padding:1px 6px;font:600 12px system-ui;box-shadow:0 1px 3px #0003}.stad.sel i{background:var(--stad)}
  h4{margin:0;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div id="map"></div>
<div id="bar" class="ui">
  <div style="position:relative">
    <button class="btn" id="radarBtn">📡 Radar ▾</button>
    <div class="menu" id="radarMenu"></div>
  </div>
  <div style="position:relative">
    <button class="btn" id="thermoBtn">🌡️ Thermo ▾</button>
    <div class="menu" id="thermoMenu"></div>
  </div>
  <div style="position:relative">
    <button class="btn" id="matchBtn">🔗 Matching ▾</button>
    <div class="menu" id="matchMenu"><button data-m="line">🚆 Train line</button><button data-m="zone">🎫 Fare zone</button><button data-m="stadium">⚽ Football</button></div>
  </div>
  <button class="btn" id="fxBtn">Effects (<span id="fxN">0</span>)</button>
  <button class="btn" id="cfgBtn" aria-label="Settings">⚙</button>
</div>

<div id="toast" class="ui"></div>

<div id="place" class="ui sheet">
  <b id="placeT">Radar</b>
  <div class="muted" id="placeH"></div>
  <div class="acts" id="locRow" style="display:none;margin:8px 0"><button class="btn" id="useLoc">📍 Use my location</button></div>
  <div class="chips" id="lineSel"></div>
  <div class="seg" id="elim"></div>
  <div class="acts"><button class="btn" id="cancel">Cancel</button><button class="btn go" id="confirm" disabled>Confirm</button></div>
</div>

<div id="fx" class="ui sheet">
  <h4>Effects <span class="muted" id="alive"></span></h4>
  <div id="list"></div>
  <div class="acts"><button class="btn" id="clear">Clear all</button><button class="btn" id="closeFx">Close</button></div>
</div>

<div id="cfgP" class="ui sheet">
  <b>Hiding radius</b>
  <div id="cfg"><input id="hr" type="range" min="0.05" max="1" step="0.05"><b id="hrv"></b></div>
  <div class="muted">Play area = everything within this radius of any station.</div>
  <label class="chk"><input type="checkbox" id="showLines"> Show train lines</label>
  <label class="chk"><input type="checkbox" id="showZones"> Show fare zones</label>
  <label class="chk"><input type="checkbox" id="showMe"> Show my location</label>
  <div class="acts" style="margin-top:8px"><button class="btn" id="basemap">Switch map style</button><button class="btn" id="closeCfg">Close</button></div>
</div>

const gArea = L.layerGroup().addTo(map), gLines = L.layerGroup().addTo(map), gZones = L.layerGroup().addTo(map), gFx = L.layerGroup().addTo(map), gDots = L.layerGroup().addTo(map), gPins = L.layerGroup().addTo(map), gMe = L.layerGroup().addTo(map), gStad = L.layerGroup().addTo(map);

// ---- fare zones: every point belongs to the zone of its nearest station ----
// Each station's cell is a circle (ZONE_REACH_KM) trimmed by the halfway line to every neighbour, built once when first needed.

  const k = Math.cos(55.69 * Math.PI / 180), R = ZONE_REACH_KM / 111.32;
  const P = ST.map(s => ({x: s.lng * k, y: s.lat})), rings = {}, edges = [], labels = [], zedges = {};

      const mx = (P[i].x + P[j].x) / 2, my = (P[i].y + P[j].y) / 2, f = p => (p.x - mx) * dx + (p.y - my) * dy, out = [];
      poly.forEach((p, n) => {

        if (fp <= 0) { out.push(p); if (fq > 0) out.push({x: p.x + t * (q.x - p.x), y: p.y + t * (q.y - p.y), l: j}); }
        else if (fq <= 0) out.push({x: p.x + t * (q.x - p.x), y: p.y + t * (q.y - p.y), l: p.l});
      });
